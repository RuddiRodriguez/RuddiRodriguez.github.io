<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 731" width="720" height="731" role="img" aria-labelledby="title desc"><title id="title">Fitting a line with NumPy</title><desc id="desc">Six illustrative study-hour and score pairs train a line. Each update changes the slope and intercept, then compares the new error with the preceding error.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 8 8"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round"/></marker></defs>
<rect width="720" height="731" fill="#faf9f4"/>
<text x="24" y="29" text-anchor="start" fill="#31665a" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.65">01   /   UML ACTIVITY DIAGRAM</text>
<text x="24" y="65" text-anchor="start" fill="#172f30" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="0">Fitting a line with NumPy</text>
<path d="M24 84 H696" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round"/>
<circle cx="260" cy="110" r="7" fill="#213f3b"/>
<rect x="72" y="139" width="376" height="58" rx="12" fill="#fff" stroke="#7e9991" stroke-width="1.4"/>
<text x="260.0" y="163.5" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="0">Load six observations</text>
<text x="260.0" y="182.5" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0">Set slope and intercept to zero.</text>
<path d="M260 216 l12 10 -12 10 -12 -10 z" fill="#fff4d7" stroke="#86682c" stroke-width="1.55"/>
<rect x="72" y="256" width="376" height="57" rx="12" fill="#e5f2ea" stroke="#7e9991" stroke-width="1.4"/>
<text x="260.0" y="280.0" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="0">Predict each score</text>
<text x="260.0" y="299.0" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0">Multiply hours by slope, then add intercept.</text>
<rect x="72" y="340" width="376" height="57" rx="12" fill="#e5f2ea" stroke="#7e9991" stroke-width="1.4"/>
<text x="260.0" y="364.0" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="0">Adjust slope and intercept</text>
<text x="260.0" y="383.0" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0">Use the errors and a learning rate of 0.01.</text>
<rect x="72" y="424" width="376" height="57" rx="12" fill="#e5f2ea" stroke="#7e9991" stroke-width="1.4"/>
<text x="260.0" y="448.0" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="0">Measure error after the update</text>
<text x="260.0" y="467.0" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0">Average the squared prediction errors.</text>
<path d="M260 527 l12 10 -12 10 -12 -10 z" fill="#fff4d7" stroke="#86682c" stroke-width="1.55"/>
<rect x="499" y="343" width="173" height="57" rx="12" fill="#fff" stroke="#7e9991" stroke-width="1.4"/>
<text x="585.5" y="367.0" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="0">Save this error</text>
<text x="585.5" y="386.0" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0">for the next step.</text>
<rect x="57" y="611" width="406" height="62" rx="12" fill="#eaf0f4" stroke="#7e9991" stroke-width="1.4"/>
<text x="260.0" y="637.5" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="0">Print the final error, slope and intercept</text>
<text x="260.0" y="656.5" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0">Plot the six observations and the fitted line.</text>
<circle cx="260" cy="706" r="9" fill="#faf9f4" stroke="#213f3b" stroke-width="1.8"/>
<circle cx="260" cy="706" r="5.4" fill="#213f3b"/>
<path d="M260 117 V139" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round"/>
<path d="M256.2 132.0 L260.0 139.0 L263.8 132.0" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M260 197 V216" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round"/>
<path d="M256.2 209.0 L260.0 216.0 L263.8 209.0" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M260 236 V256" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round"/>
<path d="M256.2 249.0 L260.0 256.0 L263.8 249.0" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M260 313 V340" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round"/>
<path d="M256.2 333.0 L260.0 340.0 L263.8 333.0" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M260 397 V424" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round"/>
<path d="M256.2 417.0 L260.0 424.0 L263.8 417.0" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M260 481 V527" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round"/>
<path d="M256.2 520.0 L260.0 527.0 L263.8 520.0" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M272 537 H585 V400" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round"/>
<path d="M588.8 407.0 L585.0 400.0 L581.2 407.0" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"/>
<text x="289" y="529" text-anchor="start" fill="#735019" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">[else]</text>
<path d="M585 343 V226 H272" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round"/>
<path d="M279.0 222.2 L272.0 226.0 L279.0 229.8" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M260 547 V611" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round"/>
<path d="M256.2 604.0 L260.0 611.0 L263.8 604.0" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"/>
<text x="272" y="564" text-anchor="start" fill="#735019" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="0">[absolute error change &lt; 10⁻⁷ or 1,500 updates]</text>
<path d="M260 673 V697" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round"/>
<path d="M256.2 690.0 L260.0 697.0 L263.8 690.0" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
