<text x="659.0" y="548.5" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="0">Draft a possible</text>
<text x="659.0" y="567.5" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0">follow-up</text>
<rect x="745" y="520" width="113" height="66" rx="12" fill="#fff" stroke="#7e9991" stroke-width="1.4"/>
<text x="801.5" y="548.5" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="0">Reuse saved</text>
<text x="801.5" y="567.5" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="0">results</text>
<rect x="324" y="612" width="335" height="4" rx="1" fill="#254d48" stroke="#254d48" stroke-width="1.4"/>
