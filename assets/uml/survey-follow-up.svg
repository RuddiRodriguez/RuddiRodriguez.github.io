<text x="128.0" y="288.5" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="0">Select settings and</text>
<text x="128.0" y="307.5" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0">read prediction cache</text>
<rect x="35" y="343" width="186" height="62" rx="12" fill="#eaf0f4" stroke="#7e9991" stroke-width="1.4"/>
<text x="128.0" y="369.5" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="0">Prepare any media</text>
<text x="128.0" y="388.5" text-anchor="middle" fill="#1b3535" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" letter-spacing="0">and build library input</text>
