<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 877" width="890" height="877" role="img" aria-labelledby="title desc"><title id="title">From survey answer to follow-up decision</title><desc id="desc">For an eligible request, the API reads a saved prediction and prepares any media. The library uses either cached results or three parallel tasks, then applies follow-up rules. The API returns the decision and optional question.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 8 8"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#355655" stroke-width="1.65" stroke-linejoin="round"/></marker></defs>
